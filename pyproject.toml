[project]
name = "hcmc-realtime-traffic-forecasting-mlops"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3",
    "duckdb",
    "ijson",
    "polars",
    "pydantic",
    "pydantic-settings",
    "pytz",
]

[project.scripts]
run-etl = "src.jobs.run_etl:main"
check-train-data = "src.jobs.check_train_data:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["config*", "src*"]